  caddy:
    build:
      context: .
      dockerfile: Dockerfile.caddy
    ports:
      - 8080:80
      - 8443:443
    volumes:
      - /home/josh/.local/share/caddy-root:/root:z

  navidrome:
    image: docker.io/deluan/navidrome:latest
    restart: unless-stopped
    ports:
      - 4533:4533
    volumes:
      - /home/josh/storage/music:/music:z
      - /home/josh/.config/navidrome:/data:z
    environment:
      ND_BASEURL: /music
      ND_ENABLEINSIGHTSCOLLECTOR: false

